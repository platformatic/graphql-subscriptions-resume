---
name: Run Tests
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
jobs:
  ci:
    strategy:
      matrix:
        # Using the latest LTS versions for CI
        node-version: [22, 24]
        os: [ubuntu-latest]
    runs-on: ${{matrix.os}}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use supported Node.js Version
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Restore cached dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: node-modules-${{ hashFiles('package.json') }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Lint
        run: pnpm run lint
      - name: Run Tests
        run: pnpm run test:ci
      - name: Run Build
        run: pnpm run build
